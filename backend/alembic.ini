# Alembic configuration for the MetaAgent API database.
#
#   alembic -c backend/alembic.ini upgrade head
#   alembic -c backend/alembic.ini revision --autogenerate -m "describe change"
#
# The database URL comes from METAAGENT_DATABASE_URL (default: sqlite file in
# the MetaAgent data directory); see backend/migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
